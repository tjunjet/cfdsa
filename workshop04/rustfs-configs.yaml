# Creating the config file for Namespace, ConfigMap, Secrets

# 1. Namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop04

# 2. RustFS ConfigMap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-config
  namespace: workshop04
  labels:
    app: rustfs
data:
  RUSTFS_ADDRESS: ":9000"            
  RUSTFS_CONSOLE_ADDRESS: ":9001"    
  RUSTFS_CONSOLE_ENABLE: "true"
  RUSTFS_VOLUMES: "http://rustfs-{0...2}.rustfs-hsvc.workshop04.svc.cluster.local:9000/data"

# 3. RustFS Secret
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-secret
  namespace: workshop04
  labels:
    app: rustfs
type: Opaque

data:
  RUSTFS_ACCESS_KEY: YWRtaW4=   # admin
  RUSTFS_SECRET_KEY: YWRtaW5hZG1pbjEyMzQ=   # adminadmin1234
