# This is the YAML file for the deployment of the Umami application

# 1. Application deployment umamiapp-deploy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamiapp-deploy
  namespace: workshop03
  labels:
    app: umami
    tier: application
spec:
  # Start with 1 replica so only one pod creates Umami's tables on first start.
  # The HorizontalPodAutoscaler scales it up afterwards.
  replicas: 1
  selector:
    matchLabels:
      app: umami
      tier: application
  template:
    metadata:
      labels:
        app: umami
        tier: application
    spec:
      containers:
        - name: umamiapp-container
          image: ghcr.io/umami-software/umami:postgresql-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              memory: 512Mi
              cpu: 256m
            limits:
              memory: 512Mi
              cpu: 256m
          env:
            # Credentials are read from umamidb-secret, never written in this file
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umamidb-secret
                  key: DATABASE_URL
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umamidb-secret
                  key: APP_SECRET
          # Liveness/readiness only start once this succeeds, so the pod isn't
          # restarted while Umami is still starting (first start creates the DB tables).
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # To check the status of the pod
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

# 2. Application service umamiapp-svc
---
apiVersion: v1
kind: Service
metadata:
  name: umamiapp-svc
  namespace: workshop03
  labels:
    app: umami
    tier: application
spec:
  type: ClusterIP # Service only accessible in the cluster
  selector:
    app: umami
    tier: application
  ports:
    - name: http
      port: 3000        # same as targetPort
      targetPort: http  # named containerPort 3000

# 3. Horizontal pod autoscaler umamiapp-hpa
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: umamiapp-hpa
  namespace: workshop03
  labels:
    app: umami
    tier: application
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: umamiapp-deploy
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80   # % of the CPU request (256m) => ~205m per pod
