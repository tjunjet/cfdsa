# Namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop03

# Database configmap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: umamidb-config
  namespace: workshop03
data:
  POSTGRES_USER: umami
  POSTGRES_DB: umami

# Database secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: umamidb-secret
  namespace: workshop03
type: Opaque
data: 
  POSTGRES_PASSWORD: bXlkYnBhc3N3b3Jk # Base64 of mydbpassword (echo -n mydbpassword | base64)
  
  # Base64 of postgresql://umami:mydbpassword@umamidb-svc:5432/umami
  DATABASE_URL: cG9zdGdyZXNxbDovL3VtYW1pOm15ZGJwYXNzd29yZEB1bWFtaWRiLXN2Yzo1NDMyL3VtYW1p

  # Encode random string generated by openSSL with Base64 (echo -n $(openssl rand -hex 32) | base64)
  APP_SECRET: MjlhNzBlNThkYmIwNGYxNDA1N2JiMWVhMmY5NDljM2VmOTE3ZWIwN2M1YzE0NmU1YjM0YWViYzI1MDBiN2FjYQ==
