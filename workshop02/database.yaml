---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggdb-deploy
  namespace: bggns
  labels:
    app: bgg
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgg
      tier: database
  template:
    metadata:
      labels:
        app: bgg
        tier: database
    spec:
      containers:
        - name: bggdb-container
          image: stackupiss/bgg-database:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql-port
              containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe: # allow up to 5 min for first-time init (loading bgg.sql)
            tcpSocket:
              port: mysql-port
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mysql-port
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mysql-port
            periodSeconds: 10
            timeoutSeconds: 5

# Database service: internal only (ClusterIP)
---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc
  namespace: bggns
  labels:
    app: bgg
    tier: database
spec:
  type: ClusterIP
  selector:
    app: bgg
    tier: database
  ports:
    - name: mysql-port
      port: 3306
      targetPort: mysql-port
